<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeJS - Your Functional Cooking Companion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🍳 RecipeJS</h1>
        <p>Your Functional Cooking Companion</p>
        
        <!-- NEW: Search Container -->
        <div class="search-container">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search recipes or ingredients..."
                autocomplete="off"
            >
            <button id="clear-search" class="clear-btn" style="display: none;">
                ✕
            </button>
        </div>
    </header>
    <main>
        <section class="controls">
            <div class="filter-group">
                <h3>Filter by Difficulty:</h3>
                <div class="button-group">
                    <button class="filter-btn active" data-filter="all">Show All Recipes</button>
                    <button class="filter-btn" data-filter="easy">Easy Recipes Only</button>
                    <button class="filter-btn" data-filter="medium">Medium Recipes Only</button>
                    <button class="filter-btn" data-filter="hard">Hard Recipes Only</button>
                    <button class="filter-btn" data-filter="quick">Quick Recipes (&lt; 30 min)</button>
                    <button class="filter-btn" data-filter="favorites">❤️ Favorites Only</button>
                </div>
            </div>
            <div class="sort-group">
                <h3>Sort by:</h3>
                <div class="button-group">
                    <button class="sort-btn" data-sort="name">Sort by Name (A-Z)</button>
                    <button class="sort-btn" data-sort="time">Sort by Time (Fastest First)</button>
                    <button class="sort-btn active" data-sort="none">Default Order</button>
                </div>
            </div>
        </section>

        <!-- NEW: Recipe Counter -->
        <p id="recipe-count" class="recipe-info">Showing 0 of 0 recipes</p>

        <div id="recipe-container">
            <!-- Recipe cards will be rendered here by JavaScript -->
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
